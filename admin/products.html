<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إدارة المنتجات - موبايل تك</title>

<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#f3f5f7;font-family:Arial,sans-serif;color:#222}
.container{max-width:850px;margin:auto}
h2{text-align:center;color:#183b35}
.form,.product{background:white;padding:16px;border-radius:12px;margin:14px 0;box-shadow:0 2px 9px #0001}
input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:8px;font-size:16px}
button{border:0;padding:11px 15px;border-radius:8px;cursor:pointer;margin:4px}
.save{background:#168a45;color:white;width:100%}
.edit{background:#e6a526;color:white}
.delete{background:#c62828;color:white}
.product img{width:100%;max-height:180px;object-fit:contain;background:#f5f5f5}
.price{color:#168a45;font-weight:bold}
.stock{color:#333}
</style>
</head>

<body>
<div class="container">
<h2>إدارة منتجات موبايل تك</h2>

<div class="form">
<h3 id="formTitle">إضافة منتج جديد</h3>

<input id="name" placeholder="اسم المنتج">
<input id="price" type="number" min="0" placeholder="السعر بالريال اليمني">
<input id="stock" type="number" min="0" step="1" placeholder="عدد القطع المتوفرة">
<select id="category">
<option value="">اختر القسم</option>
</select>

<input id="image" type="url" placeholder="رابط صورة المنتج (اختياري)">

<button class="save" onclick="saveProduct()">حفظ المنتج</button>
<button id="cancel" onclick="resetForm()" hidden>إلغاء التعديل</button>
</div>

<h3>المنتجات المسجلة</h3>
<div id="products">جارٍ تحميل المنتجات...</div>
</div>

<script>
let products=[];
let editingId=null;

async function loadCategories(){
  const response=await fetch("/api/categories");
  const categories=await response.json();
  const select=document.getElementById("category");
  select.innerHTML='<option value="">اختر القسم</option>';

  categories.forEach(c=>{
    const option=document.createElement("option");
    option.value=c.id;
    option.textContent=c.name;
    select.appendChild(option);
  });
}

async function loadProducts(){
  const response=await fetch("/api/products");
  products=await response.json();
  const container=document.getElementById("products");
  container.innerHTML="";

  products.forEach(p=>{
    const card=document.createElement("div");
    card.className="product";

    const title=document.createElement("h3");
    title.textContent=p.name;
    card.appendChild(title);

    if(p.image){
      const img=document.createElement("img");
      img.src=p.image;
      img.alt=p.name;
      card.appendChild(img);
    }

    const price=document.createElement("p");
    price.className="price";
    price.textContent="السعر: "+p.price+" ريال";
    card.appendChild(price);

    const stock=document.createElement("p");
    stock.className="stock";
    stock.textContent="المخزون: "+p.stock+" قطعة";
    card.appendChild(stock);

    const edit=document.createElement("button");
    edit.className="edit";
    edit.textContent="تعديل";
    edit.onclick=()=>editProduct(p.id);
    card.appendChild(edit);

    const del=document.createElement("button");
    del.className="delete";
    del.textContent="حذف";
    del.onclick=()=>deleteProduct(p.id);
    card.appendChild(del);

    container.appendChild(card);
  });

  if(products.length===0){
    container.textContent="لا توجد منتجات حتى الآن";
  }
}

async function saveProduct(){
  const name=document.getElementById("name").value.trim();
  const price=document.getElementById("price").value;
  const stock=document.getElementById("stock").value;
  const category_id=document.getElementById("category").value;
  const image=document.getElementById("image").value.trim();

  if(!name||!category_id||price===""||stock===""){
    alert("أكمل الاسم والسعر والمخزون والقسم");
    return;
  }

  const data={
    name,price,stock:Number(stock),
    category_id:Number(category_id),image
  };

  const response=await fetch(
    editingId===null?"/api/products":"/api/products/"+editingId,
    {
      method:editingId===null?"POST":"PUT",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(data)
    }
  );

  const result=await response.json();
  if(!response.ok){
    alert(result.error||"حدث خطأ");
    return;
  }

  alert(result.message);
  resetForm();
  loadProducts();
}

function editProduct(id){
  const p=products.find(item=>item.id===id);
  if(!p)return;

  editingId=id;
  document.getElementById("name").value=p.name;
  document.getElementById("price").value=p.price;
  document.getElementById("stock").value=p.stock;
  document.getElementById("category").value=p.category_id;
  document.getElementById("image").value=p.image||"";
  document.getElementById("formTitle").textContent="تعديل المنتج";
  document.getElementById("cancel").hidden=false;
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteProduct(id){
  if(!confirm("هل تريد حذف هذا المنتج؟"))return;

  const response=await fetch("/api/products/"+id,{method:"DELETE"});
  const result=await response.json();
  alert(result.message);
  loadProducts();
}

function resetForm(){
  editingId=null;
  document.getElementById("name").value="";
  document.getElementById("price").value="";
  document.getElementById("stock").value="";
  document.getElementById("category").value="";
  document.getElementById("image").value="";
  document.getElementById("formTitle").textContent="إضافة منتج جديد";
  document.getElementById("cancel").hidden=true;
}

loadCategories();
loadProducts();
</script>
</body>
</html>
